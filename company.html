<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DARSO — Company Deep Dive</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&family=Figtree:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0f;--card:rgba(255,255,255,.04);--border:rgba(255,255,255,.08);--purple:#a855f7;--purple2:#7c3aed;--cyan:#22d3ee;--green:#00ff88;--gold:#f59e0b;--red:#ef4444;--white:#f0eeff;--muted:rgba(200,185,255,.4);--fh:'Space Grotesk',sans-serif;--fb:'Inter',sans-serif;--fm:'JetBrains Mono',monospace;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--white);font-family:var(--fb);min-height:100vh;}
::selection{background:var(--purple);color:#fff;}
.header{display:flex;align-items:center;justify-content:space-between;padding:1rem 2rem;border-bottom:1px solid var(--border);background:rgba(10,10,15,.8);backdrop-filter:blur(12px);position:sticky;top:0;z-index:10;}
.header .logo{font-family:var(--fh);font-size:1.2rem;color:var(--purple);}
.header .symbol{font-family:var(--fm);color:var(--cyan);font-size:.9rem;}
.header a{color:var(--muted);text-decoration:none;font-size:.82rem;}
.header a:hover{color:var(--white);}
.container{max-width:960px;margin:0 auto;padding:2rem;}
.loading{text-align:center;padding:4rem 2rem;color:var(--muted);font-size:.95rem;}
.loading .spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--purple);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 1rem;}
@keyframes spin{to{transform:rotate(360deg);}}
.card{background:var(--card);border:1px solid var(--border);border-radius:.75rem;padding:1.5rem;margin-bottom:1.25rem;}
.card h2{font-family:var(--fh);font-size:1.1rem;margin-bottom:1rem;color:var(--purple);}
.card h3{font-family:var(--fm);font-size:.72rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin-bottom:.5rem;}
.grid-2{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:.5rem;}
.grid-2 .field{padding:.5rem .7rem;background:rgba(255,255,255,.04);border-radius:.4rem;}
.grid-2 .field .label{font-size:.68rem;color:var(--muted);font-family:var(--fm);}
.grid-2 .field .val{font-size:.95rem;margin-top:.15rem;}
.desc{font-size:.9rem;line-height:1.7;color:#d0d0e0;}
.fin-table{width:100%;border-collapse:collapse;font-size:.82rem;}
.fin-table th{text-align:left;padding:.5rem .6rem;color:var(--muted);font-family:var(--fm);font-size:.68rem;text-transform:uppercase;letter-spacing:.1em;border-bottom:1px solid var(--border);}
.fin-table td{padding:.45rem .6rem;border-bottom:1px solid rgba(255,255,255,.04);color:#d0d0e0;}
.fin-table tr:hover td{background:rgba(255,255,255,.03);}
.ratio-chips{display:flex;flex-wrap:wrap;gap:.35rem;margin-top:.5rem;}
.ratio-chips span{background:rgba(255,255,255,.06);padding:.25rem .6rem;border-radius:.3rem;font-size:.78rem;}
.badge{display:inline-block;padding:.2rem .6rem;border-radius:.3rem;font-size:.72rem;font-family:var(--fm);}
.badge.green{background:rgba(0,255,136,.12);color:var(--green);}
.badge.red{background:rgba(239,68,68,.12);color:var(--red);}
.chat-box{background:var(--card);border:1px solid var(--border);border-radius:.75rem;overflow:hidden;}
.chat-msgs{height:240px;overflow-y:auto;padding:1rem;display:flex;flex-direction:column;gap:.6rem;}
.chat-msgs::-webkit-scrollbar{width:3px;}
.chat-msgs::-webkit-scrollbar-thumb{background:rgba(168,85,247,.3);border-radius:2px;}
.cm{background:rgba(255,255,255,.04);border-radius:.5rem;padding:.6rem .85rem;font-size:.85rem;line-height:1.5;color:#d0d0e0;max-width:85%;}
.cm.user{background:rgba(168,85,247,.12);align-self:flex-end;color:var(--white);}
.cm.ai{border-left:2px solid var(--purple);}
.chat-input{display:flex;gap:.5rem;padding:.6rem .85rem;border-top:1px solid var(--border);}
.chat-input input{flex:1;background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:.4rem;padding:.5rem .75rem;color:var(--white);font-family:var(--fb);font-size:.85rem;outline:none;}
.chat-input input:focus{border-color:var(--purple);}
.chat-input button{padding:.5rem 1rem;background:var(--purple);color:#fff;border:none;border-radius:.4rem;cursor:pointer;font-family:var(--fb);font-size:.82rem;}
.chat-input button:hover{opacity:.85;}
@media(max-width:600px){.container{padding:1rem;}.grid-2{grid-template-columns:repeat(2,1fr);}}
</style>
</head>
<body>

<div class="header">
  <div class="logo">DARSO</div>
  <div class="symbol" id="headerSymbol">Company Deep Dive</div>
  <a href="/" target="_blank">Back to Dashboard</a>
</div>

<div class="container" id="app">
  <div class="loading" id="loadingScreen">
    <div class="spinner"></div>
    <div id="loadStatus">Loading company profile...</div>
  </div>
  <div id="content" style="display:none;"></div>
</div>

<script>
var SYMBOL = new URLSearchParams(window.location.search).get('symbol') || '';

if (!SYMBOL) {
  document.getElementById('loadingScreen').innerHTML = '<div style="color:var(--red);">No symbol specified. <a href="/" style="color:var(--purple);">Go back</a></div>';
} else {
  document.getElementById('headerSymbol').textContent = SYMBOL;
  loadAll();
}

function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function loadAll() {
  var status = document.getElementById('loadStatus');
  var content = document.getElementById('content');
  var company = SYMBOL;

  // Step 1: Profile
  fetch('/api/company/profile', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name:company}) })
    .then(function(r){return r.json()})
    .then(function(profile){
      if (profile.error) { status.textContent = 'Error: ' + profile.error; return; }
      status.textContent = 'Profile loaded. Fetching 5-year financials...';
      renderProfile(profile);
      // Step 2: Financials
      fetch('/api/company/financials', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name:company}) })
        .then(function(r){return r.json()})
        .then(function(fin){
          status.textContent = 'Complete.';
          renderFinancials(fin);
          document.getElementById('loadingScreen').style.display = 'none';
          content.style.display = 'block';
        })
        .catch(function(){ status.textContent = 'Financials loaded.'; document.getElementById('loadingScreen').style.display = 'none'; content.style.display = 'block'; });
    })
    .catch(function(err){ status.textContent = 'Error: ' + err.message; });
}

function renderProfile(p) {
  var d = p.profile || p;
  var content = document.getElementById('content');
  var html = '<div class="card"><h2>' + esc(d.name || SYMBOL) + '</h2><div class="grid-2">' +
    (d.ticker ? '<div class="field"><div class="label">Ticker</div><div class="val" style="font-family:var(--fm);color:var(--cyan);">' + esc(d.ticker) + '</div></div>' : '') +
    (d.sector ? '<div class="field"><div class="label">Sector</div><div class="val">' + esc(d.sector) + '</div></div>' : '') +
    (d.industry ? '<div class="field"><div class="label">Industry</div><div class="val">' + esc(d.industry) + '</div></div>' : '') +
    (d.headquarters ? '<div class="field"><div class="label">Headquarters</div><div class="val">' + esc(d.headquarters) + '</div></div>' : '') +
    (d.founded ? '<div class="field"><div class="label">Founded</div><div class="val">' + d.founded + '</div></div>' : '') +
    (d.employees ? '<div class="field"><div class="label">Employees</div><div class="val">' + d.employees.toLocaleString() + '</div></div>' : '') +
    (d.website && d.website !== 'N/A' ? '<div class="field"><div class="label">Website</div><div class="val"><a href="' + esc(d.website) + '" target="_blank" style="color:var(--cyan);">' + esc(d.website) + '</a></div></div>' : '') +
    '</div>' +
    (d.description ? '<div class="desc" style="margin-top:.75rem;">' + esc(d.description) + '</div>' : '') +
    (d.segments && d.segments.length ? '<div style="margin-top:1rem;"><h3>Business Segments</h3><div style="display:flex;flex-wrap:wrap;gap:.4rem;">' + d.segments.map(function(s){return '<div style="background:rgba(168,85,247,.1);border:1px solid rgba(168,85,247,.2);border-radius:.5rem;padding:.4rem .7rem;flex:1;min-width:140px;"><div style="display:flex;justify-content:space-between;"><span style="font-weight:600;font-size:.85rem;">' + esc(s.name) + '</span><span style="color:var(--cyan);font-family:var(--fm);">' + (s.revenuePct||0) + '%</span></div><div style="font-size:.75rem;color:var(--muted);">' + esc(s.description||'') + '</div></div>';}).join('') + '</div></div>' : '') +
    '</div>';
  content.innerHTML = html;
}

function renderFinancials(data) {
  var fin = data.financials || {};
  var ratios = data.ratios || {};
  var growth = data.growth || {};
  var html = '<div class="card"><h2>5-Year Financials</h2><div style="overflow-x:auto;"><table class="fin-table"><thead><tr><th>Metric</th><th>2020</th><th>2021</th><th>2022</th><th>2023</th><th>2024</th><th>2025</th></tr></thead><tbody>';
  function addRow(label, obj) {
    if (!obj) return;
    html += '<tr><td style="font-weight:500;">' + label + '</td>';
    ['2020','2021','2022','2023','2024','2025'].forEach(function(y) {
      var v = obj[y];
      if (v == null) { html += '<td style="color:var(--muted);">\u2014</td>'; return; }
      html += '<td>' + (v >= 100 ? '$' + v.toFixed(1) + 'B' : '$' + (v*1000).toFixed(0) + 'M') + '</td>';
    });
    html += '</tr>';
  }
  addRow('Revenue', fin.revenue);
  addRow('Net Income', fin.netIncome);
  addRow('Operating Income', fin.operatingIncome);
  addRow('Total Assets', fin.totalAssets);
  addRow('Total Debt', fin.totalDebt);
  addRow('Free Cash Flow', fin.freeCashFlow);
  addRow('Operating Margin', fin.operatingMargin);
  addRow('Net Margin', fin.netMargin);
  html += '</tbody></table></div>';

  if (fin.revenueGrowth) {
    html += '<div style="margin-top:1rem;"><h3>Revenue Growth</h3><div style="display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.5rem;">';
    Object.keys(fin.revenueGrowth).forEach(function(y) {
      var v = fin.revenueGrowth[y];
      if (v == null) return;
      var c = v >= 0 ? 'var(--green)' : 'var(--red)';
      html += '<span style="background:rgba(255,255,255,.04);padding:.25rem .5rem;border-radius:.3rem;font-size:.78rem;"><span style="color:var(--muted);">' + y + '</span> <span style="color:' + c + ';font-weight:600;">' + (v >= 0 ? '+' : '') + v.toFixed(1) + '%</span></span>';
    });
    html += '</div></div>';
  }

  html += '<div style="margin-top:1rem;"><h3>Key Ratios</h3><div class="ratio-chips">';
  if (ratios.peRatio) html += '<span>P/E: ' + ratios.peRatio + '</span>';
  if (ratios.forwardPE) html += '<span>Fwd P/E: ' + ratios.forwardPE + '</span>';
  if (ratios.pbRatio) html += '<span>P/B: ' + ratios.pbRatio + '</span>';
  if (ratios.roe) html += '<span>ROE: ' + ratios.roe + '%</span>';
  if (ratios.roa) html += '<span>ROA: ' + ratios.roa + '%</span>';
  if (ratios.debtToEquity) html += '<span>D/E: ' + ratios.debtToEquity + '</span>';
  if (ratios.currentRatio) html += '<span>Current: ' + ratios.currentRatio + '</span>';
  if (ratios.dividendYield) html += '<span>Div Yield: ' + ratios.dividendYield + '%</span>';
  if (ratios.beta) html += '<span>Beta: ' + ratios.beta + '</span>';
  if (growth.revenueCagr5y) html += '<span style="color:var(--green);">Rev CAGR: ' + growth.revenueCagr5y + '%</span>';
  if (growth.earningsCagr5y) html += '<span style="color:var(--green);">Earnings CAGR: ' + growth.earningsCagr5y + '%</span>';
  html += '</div></div></div>';

  // Chat section
  html += '<div class="card"><h2>Ask About ' + esc(SYMBOL) + '</h2><p style="color:var(--muted);font-size:.85rem;margin-bottom:1rem;">Ask anything about this company \u2014 financials, management, competitive position, or risks.</p>' +
    '<div class="chat-box"><div class="chat-msgs" id="chatMsgs"><div class="cm ai">I am a specialist analyst focused on <strong>' + esc(SYMBOL) + '</strong>. Ask me anything.</div></div>' +
    '<div class="chat-input"><input type="text" id="chatInput" placeholder="Ask about ' + esc(SYMBOL) + '..." onkeydown="if(event.key===\'Enter\')askCompany()"><button onclick="askCompany()">Ask</button></div></div></div>';

  document.getElementById('content').innerHTML += html;
}

function askCompany() {
  var input = document.getElementById('chatInput');
  var q = input.value.trim();
  if (!q) return;
  input.value = '';
  var msgs = document.getElementById('chatMsgs');
  msgs.innerHTML += '<div class="cm user">' + esc(q) + '</div>';
  msgs.innerHTML += '<div class="cm ai" style="color:var(--muted);">Thinking...</div>';
  msgs.scrollTop = msgs.scrollHeight;

  fetch('/api/company/ask', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({company: SYMBOL, question: q}) })
    .then(function(r){return r.json()})
    .then(function(data){
      msgs.innerHTML = msgs.innerHTML.replace(/<div class="cm ai" style="color:var\(--muted\);">Thinking\.\.\.<\/div>$/, '');
      msgs.innerHTML += '<div class="cm ai">' + (data.reply || 'No response') + '</div>';
      msgs.scrollTop = msgs.scrollHeight;
    })
    .catch(function(err){
      msgs.innerHTML = msgs.innerHTML.replace(/<div class="cm ai" style="color:var\(--muted\);">Thinking\.\.\.<\/div>$/, '');
      msgs.innerHTML += '<div class="cm ai" style="color:var(--red);">Error: ' + esc(err.message) + '</div>';
    });
}
</script>
</body>
</html>
