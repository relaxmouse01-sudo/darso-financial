<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DARSO — Company AI Agent</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0f;--card:rgba(255,255,255,.04);--border:rgba(255,255,255,.08);--purple:#a855f7;--cyan:#22d3ee;--green:#00ff88;--gold:#f59e0b;--red:#ef4444;--white:#f0eeff;--muted:rgba(200,185,255,.4);--fh:'Space Grotesk',sans-serif;--fb:'Inter',sans-serif;--fm:'JetBrains Mono',monospace;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--white);font-family:var(--fb);min-height:100vh;}
::selection{background:var(--purple);color:#fff;}
.header{display:flex;align-items:center;justify-content:space-between;padding:.75rem 1.5rem;border-bottom:1px solid var(--border);background:rgba(10,10,15,.8);backdrop-filter:blur(12px);position:sticky;top:0;z-index:20;}
.header .logo{font-family:var(--fh);font-size:1.1rem;color:var(--purple);font-weight:700;}
.header .symbol{font-family:var(--fm);color:var(--cyan);font-size:.85rem;}
.header a{color:var(--muted);text-decoration:none;font-size:.8rem;}
.header a:hover{color:var(--white);}
.container{max-width:1100px;margin:0 auto;padding:1.5rem;}
.loading{text-align:center;padding:4rem 2rem;color:var(--muted);font-size:.9rem;}
.loading .spinner{width:28px;height:28px;border:2px solid var(--border);border-top-color:var(--purple);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto .75rem;}
@keyframes spin{to{transform:rotate(360deg);}}
.card{background:var(--card);border:1px solid var(--border);border-radius:.75rem;padding:1.25rem;margin-bottom:1rem;}
.card h2{font-family:var(--fh);font-size:1rem;margin-bottom:.75rem;color:var(--purple);}
.card h3{font-family:var(--fm);font-size:.68rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin-bottom:.4rem;}
.desc{font-size:.85rem;line-height:1.6;color:#d0d0e0;}
.grid-2{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:.4rem;}
.grid-2 .field{padding:.4rem .6rem;background:rgba(255,255,255,.04);border-radius:.35rem;}
.grid-2 .field .label{font-size:.65rem;color:var(--muted);font-family:var(--fm);}
.grid-2 .field .val{font-size:.85rem;margin-top:.1rem;}
.fin-table{width:100%;border-collapse:collapse;font-size:.8rem;}
.fin-table th{text-align:left;padding:.4rem .5rem;color:var(--muted);font-family:var(--fm);font-size:.65rem;text-transform:uppercase;letter-spacing:.1em;border-bottom:1px solid var(--border);}
.fin-table td{padding:.35rem .5rem;border-bottom:1px solid rgba(255,255,255,.04);color:#d0d0e0;}
.fin-table tr:hover td{background:rgba(255,255,255,.03);}
.tabs{display:flex;gap:.25rem;margin-bottom:1rem;flex-wrap:wrap;border-bottom:1px solid var(--border);padding-bottom:.25rem;}
.tab{padding:.4rem .85rem;border-radius:.35rem .35rem 0 0;font-family:var(--fm);font-size:.72rem;color:var(--muted);cursor:pointer;border:1px solid transparent;border-bottom:none;transition:all .15s;}
.tab:hover{color:var(--white);background:rgba(168,85,247,.06);}
.tab.active{color:var(--purple);border-color:var(--border);background:rgba(168,85,247,.08);}
.tab-pane{display:none;}
.tab-pane.active{display:block;}
.badge{display:inline-block;padding:.15rem .5rem;border-radius:.25rem;font-size:.7rem;font-family:var(--fm);}
.badge.green{background:rgba(0,255,136,.12);color:var(--green);}
.badge.red{background:rgba(239,68,68,.12);color:var(--red);}
.badge.gold{background:rgba(245,158,11,.12);color:var(--gold);}
.badge.purple{background:rgba(168,85,247,.12);color:var(--purple);}
.chat-box{background:var(--card);border:1px solid var(--border);border-radius:.75rem;overflow:hidden;height:400px;display:flex;flex-direction:column;}
.chat-msgs{flex:1;overflow-y:auto;padding:.75rem;display:flex;flex-direction:column;gap:.5rem;}
.chat-msgs::-webkit-scrollbar{width:3px;}
.chat-msgs::-webkit-scrollbar-thumb{background:rgba(168,85,247,.3);border-radius:2px;}
.cm{background:rgba(255,255,255,.04);border-radius:.5rem;padding:.5rem .75rem;font-size:.82rem;line-height:1.5;color:#d0d0e0;max-width:88%;}
.cm.user{background:rgba(168,85,247,.12);align-self:flex-end;color:var(--white);}
.cm.ai{border-left:2px solid var(--purple);}
.cm.system{background:rgba(245,158,11,.08);border-left:2px solid var(--gold);align-self:center;font-size:.72rem;color:var(--gold);max-width:100%;}
.chat-input{display:flex;gap:.4rem;padding:.5rem .75rem;border-top:1px solid var(--border);}
.chat-input input{flex:1;background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:.35rem;padding:.45rem .65rem;color:var(--white);font-family:var(--fb);font-size:.82rem;outline:none;}
.chat-input input:focus{border-color:var(--purple);}
.chat-input button{padding:.45rem .85rem;background:var(--purple);color:#fff;border:none;border-radius:.35rem;cursor:pointer;font-family:var(--fb);font-size:.8rem;}
.chat-input button:hover{opacity:.85;}
.kb-item{background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:.5rem;padding:.5rem .75rem;margin-bottom:.4rem;font-size:.82rem;color:#d0d0e0;}
.kb-item .kb-tag{display:inline-block;padding:.1rem .4rem;border-radius:.2rem;font-size:.62rem;font-family:var(--fm);background:rgba(168,85,247,.12);color:var(--purple);margin-right:.4rem;}
textarea.kb-input{width:100%;background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:.4rem;padding:.5rem .65rem;color:var(--white);font-family:var(--fb);font-size:.82rem;outline:none;resize:vertical;min-height:60px;}
textarea.kb-input:focus{border-color:var(--purple);}
.product-card{background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:.5rem;padding:.65rem .85rem;margin-bottom:.5rem;}
.product-card .pname{font-weight:600;font-size:.88rem;color:var(--white);}
.product-card .pdesc{font-size:.78rem;color:#b0a8d0;margin-top:.15rem;}
.product-card .pmeta{display:flex;gap:.5rem;margin-top:.3rem;font-size:.7rem;font-family:var(--fm);color:var(--muted);}
.btn{display:inline-flex;align-items:center;gap:.35rem;padding:.4rem .85rem;border-radius:.35rem;border:none;font-family:var(--fb);font-size:.78rem;cursor:pointer;transition:opacity .15s;}
.btn:hover{opacity:.85;}
.btn-p{background:var(--purple);color:#fff;}
.btn-gold{background:var(--gold);color:#000;}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--white);}
.tag{display:inline-block;padding:.1rem .4rem;border-radius:.2rem;font-size:.62rem;font-family:var(--fm);margin-right:.25rem;margin-bottom:.25rem;}
.tag.green{background:rgba(0,255,136,.12);color:var(--green);}
.tag.red{background:rgba(239,68,68,.12);color:var(--red);}
.tag.gold{background:rgba(245,158,11,.12);color:var(--gold);}
.tag.cyan{background:rgba(34,211,238,.12);color:var(--cyan);}
@media(max-width:600px){.container{padding:1rem;}.grid-2{grid-template-columns:repeat(2,1fr);}.tabs{gap:.15rem;}.tab{font-size:.65rem;padding:.3rem .6rem;}}
</style>
</head>
<body>

<div class="header">
  <div class="logo">DARSO</div>
  <div class="symbol" id="headerSymbol">Company AI Agent</div>
  <div style="display:flex;gap:.6rem;align-items:center;">
    <a href="/" target="_blank">Dashboard</a>
    <a href="/admin" target="_blank" style="color:var(--gold);">Admin</a>
  </div>
</div>

<div class="container" id="app">
  <div class="loading" id="loadingScreen">
    <div class="spinner"></div>
    <div id="loadStatus">Loading company profile...</div>
  </div>
  <div id="content" style="display:none;"></div>
</div>

<script>
var SYMBOL = new URLSearchParams(window.location.search).get('symbol') || '';
var COMPANY_DATA = {};
var KNOWLEDGE_BASE = [];
var ACTIVE_TAB = 'overview';

if (!SYMBOL) {
  document.getElementById('loadingScreen').innerHTML = '<div style="color:var(--red);">No company specified. <a href="/" style="color:var(--purple);">Go back</a></div>';
} else {
  document.getElementById('headerSymbol').textContent = SYMBOL;
  loadAll();
}

function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function loadAll() {
  var status = document.getElementById('loadStatus');
  var content = document.getElementById('content');
  var company = SYMBOL;

  fetch('/api/company/profile', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name:company}) })
    .then(function(r){return r.json()})
    .then(function(profile){
      if (profile.error) { status.textContent = 'Error: ' + profile.error; return; }
      COMPANY_DATA.profile = profile;
      status.textContent = 'Profile loaded. Fetching financials...';
      fetch('/api/company/financials', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name:company}) })
        .then(function(r){return r.json()})
        .then(function(fin){
          COMPANY_DATA.financials = fin;
          status.textContent = 'Complete.';
          renderPage();
          document.getElementById('loadingScreen').style.display = 'none';
          content.style.display = 'block';
        })
        .catch(function(){
          status.textContent = 'Financials loaded.';
          renderPage();
          document.getElementById('loadingScreen').style.display = 'none';
          content.style.display = 'block';
        });
    })
    .catch(function(err){ status.textContent = 'Error: ' + err.message; });
}

function switchTab(tab) {
  ACTIVE_TAB = tab;
  document.querySelectorAll('.tab').forEach(function(t){ t.classList.remove('active'); });
  document.querySelectorAll('.tab-pane').forEach(function(p){ p.classList.remove('active'); });
  var tabEl = document.getElementById('tab-' + tab);
  var paneEl = document.getElementById('pane-' + tab);
  if (tabEl) tabEl.classList.add('active');
  if (paneEl) paneEl.classList.add('active');
  // If switching to chat, focus input
  if (tab === 'chat') {
    var inp = document.getElementById('chatInput');
    if (inp) setTimeout(function(){ inp.focus(); }, 100);
  }
}

function renderPage() {
  var p = COMPANY_DATA.profile || {};
  var prof = p.profile || p;
  var fin = COMPANY_DATA.financials || {};
  var content = document.getElementById('content');

  var tabs = ['overview','financials','reputation','products','trends','knowledge','chat'];
  var tabLabels = ['Overview','Financials','Reputation','Products','Trends','Knowledge','AI Chat'];

  var html = '<div class="tabs">';
  tabs.forEach(function(t,i){
    html += '<div class="tab' + (i===0?' active':'') + '" id="tab-' + t + '" onclick="switchTab(\'' + t + '\')">' + tabLabels[i] + '</div>';
  });
  html += '</div>';

  // ── OVERVIEW ──
  html += '<div class="tab-pane active" id="pane-overview">';
  html += '<div class="card"><h2>' + esc(prof.name || SYMBOL) + '</h2>';
  html += '<div class="grid-2">' +
    (prof.ticker && prof.ticker !== 'N/A' ? '<div class="field"><div class="label">Ticker</div><div class="val" style="font-family:var(--fm);color:var(--cyan);">' + esc(prof.ticker) + '</div></div>' : '') +
    (prof.sector ? '<div class="field"><div class="label">Sector</div><div class="val">' + esc(prof.sector) + '</div></div>' : '') +
    (prof.industry ? '<div class="field"><div class="label">Industry</div><div class="val">' + esc(prof.industry) + '</div></div>' : '') +
    (prof.headquarters ? '<div class="field"><div class="label">HQ</div><div class="val">' + esc(prof.headquarters) + '</div></div>' : '') +
    (prof.founded ? '<div class="field"><div class="label">Founded</div><div class="val">' + prof.founded + '</div></div>' : '') +
    (prof.employees ? '<div class="field"><div class="label">Employees</div><div class="val">' + prof.employees.toLocaleString() + '</div></div>' : '') +
    (prof.exchanges && prof.exchanges.length ? '<div class="field"><div class="label">Exchange</div><div class="val">' + esc(prof.exchanges.join(', ')) + '</div></div>' : '') +
    '</div>';
  if (prof.description) html += '<div class="desc" style="margin-top:.5rem;">' + esc(prof.description) + '</div>';
  if (prof.keyPeople && prof.keyPeople.length) {
    html += '<div style="margin-top:.75rem;"><h3>Key People</h3><div style="display:flex;flex-wrap:wrap;gap:.35rem;">';
    prof.keyPeople.forEach(function(kp){
      html += '<span style="background:rgba(168,85,247,.08);border:1px solid rgba(168,85,247,.15);border-radius:.3rem;padding:.25rem .5rem;font-size:.78rem;"><span style="color:var(--white);">' + esc(kp.name) + '</span> <span style="color:var(--muted);font-family:var(--fm);font-size:.7rem;">' + esc(kp.title||'') + '</span></span>';
    });
    html += '</div></div>';
  }
  if (prof.segments && prof.segments.length) {
    html += '<div style="margin-top:.75rem;"><h3>Business Segments</h3><div style="display:flex;flex-wrap:wrap;gap:.35rem;">';
    prof.segments.forEach(function(s){
      html += '<div style="background:rgba(168,85,247,.08);border:1px solid rgba(168,85,247,.15);border-radius:.5rem;padding:.35rem .6rem;flex:1;min-width:130px;"><div style="display:flex;justify-content:space-between;align-items:center;"><span style="font-weight:600;font-size:.8rem;">' + esc(s.name) + '</span><span class="badge purple">' + (s.revenuePct||0) + '%</span></div><div style="font-size:.7rem;color:var(--muted);margin-top:.15rem;">' + esc(s.description||'') + '</div></div>';
    });
    html += '</div></div>';
  }
  if (prof.competitors && prof.competitors.length) {
    html += '<div style="margin-top:.75rem;"><h3>Competitors</h3><div style="display:flex;flex-wrap:wrap;gap:.3rem;">';
    prof.competitors.forEach(function(c){
      html += '<span class="tag gold">' + esc(c) + '</span>';
    });
    html += '</div></div>';
  }
  html += '</div>';
  // Stock info if ticker available
  var ticker = prof.ticker && prof.ticker !== 'N/A' ? prof.ticker : '';
  if (ticker) {
    html += '<div class="card" id="stockCard"><h2>Market Data</h2><div id="stockData" style="color:var(--muted);font-size:.82rem;">Loading stock data...</div></div>';
  }
  html += '</div>';

  // ── FINANCIALS ──
  html += '<div class="tab-pane" id="pane-financials">';
  html += renderFinancialsHTML(fin);
  html += '</div>';

  // ── REPUTATION ──
  html += '<div class="tab-pane" id="pane-reputation">';
  html += '<div style="margin-bottom:.75rem;"><button class="btn btn-p" onclick="analyzeReputation()"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg> Analyze Reputation</button></div>';
  html += '<div id="reputationResult"><div style="color:var(--muted);font-size:.82rem;padding:1rem 0;">Click to run AI market reputation analysis for ' + esc(SYMBOL) + '.</div></div>';
  html += '</div>';

  // ── PRODUCTS ──
  html += '<div class="tab-pane" id="pane-products">';
  html += '<div style="margin-bottom:.75rem;display:flex;gap:.4rem;flex-wrap:wrap;">' +
    '<button class="btn btn-p" onclick="analyzeProducts()">Analyze Products</button>' +
    '<button class="btn btn-gold" onclick="analyzeDropshipping()">Dropshipping Suggestions</button>' +
    '</div>';
  html += '<div id="productsResult"><div style="color:var(--muted);font-size:.82rem;padding:1rem 0;">Click to analyze products or get dropshipping suggestions.</div></div>';
  html += '</div>';

  // ── TRENDS ──
  html += '<div class="tab-pane" id="pane-trends">';
  html += '<div style="margin-bottom:.75rem;"><button class="btn btn-p" onclick="analyzeTrends()">Analyze Market Trends</button></div>';
  html += '<div id="trendsResult"><div style="color:var(--muted);font-size:.82rem;padding:1rem 0;">Click to analyze market trends affecting ' + esc(SYMBOL) + '.</div></div>';
  html += '</div>';

  // ── KNOWLEDGE BASE ──
  html += '<div class="tab-pane" id="pane-knowledge">';
  html += '<div class="card" style="margin-bottom:.75rem;">';
  html += '<h2>Add Knowledge</h2>';
  html += '<p style="font-size:.78rem;color:var(--muted);margin-bottom:.5rem;">Add private information about your company. The AI will use this context when answering questions.</p>';
  html += '<textarea class="kb-input" id="kbInput" placeholder="e.g. We launched a new skincare line in Q2 2025..."></textarea>';
  html += '<div style="margin-top:.4rem;display:flex;gap:.4rem;">' +
    '<input id="kbTag" type="text" placeholder="Tag (e.g. products, strategy, competitors)" style="flex:1;background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:.35rem;padding:.35rem .5rem;color:var(--white);font-size:.78rem;font-family:var(--fm);outline:none;">' +
    '<button class="btn btn-p" onclick="addKnowledge()" style="font-size:.72rem;">Add</button>' +
    '</div>';
  html += '</div>';
  html += '<div id="kbList"><div style="color:var(--muted);font-size:.82rem;">No knowledge entries yet.</div></div>';
  html += '</div>';

  // ── AI CHAT ──
  html += '<div class="tab-pane" id="pane-chat">';
  html += '<div class="chat-box"><div class="chat-msgs" id="chatMsgs"><div class="cm system">I am your personal AI agent for <strong>' + esc(SYMBOL) + '</strong>. I know the company profile, financials, and any private knowledge you\'ve added. Ask me anything.</div></div>' +
    '<div class="chat-input"><input type="text" id="chatInput" placeholder="Ask your company AI agent..." onkeydown="if(event.key===\'Enter\')askCompany()"><button onclick="askCompany()">Ask</button></div></div>';
  html += '</div>';

  content.innerHTML = html;

  // Fetch stock data if ticker exists
  if (ticker) {
    fetchStockData(ticker);
  }
}

function renderFinancialsHTML(fin) {
  var f = fin.financials || {};
  var ratios = fin.ratios || {};
  var html = '<div class="card"><h2>5-Year Financials</h2><div style="overflow-x:auto;"><table class="fin-table"><thead><tr><th>Metric</th><th>2020</th><th>2021</th><th>2022</th><th>2023</th><th>2024</th><th>2025</th></tr></thead><tbody>';
  function addRow(label, obj) {
    if (!obj) return;
    html += '<tr><td style="font-weight:500;">' + label + '</td>';
    ['2020','2021','2022','2023','2024','2025'].forEach(function(y) {
      var v = obj[y];
      if (v == null) { html += '<td style="color:var(--muted);">\u2014</td>'; return; }
      html += '<td>' + (v >= 100 ? '$' + v.toFixed(1) + 'B' : '$' + (v*1000).toFixed(0) + 'M') + '</td>';
    });
    html += '</tr>';
  }
  addRow('Revenue', f.revenue);
  addRow('Net Income', f.netIncome);
  addRow('Operating Income', f.operatingIncome);
  addRow('Total Assets', f.totalAssets);
  addRow('Total Debt', f.totalDebt);
  addRow('Free Cash Flow', f.freeCashFlow);
  html += '</tbody></table></div>';

  if (f.revenueGrowth) {
    html += '<div style="margin-top:.75rem;"><h3>Revenue Growth</h3><div style="display:flex;gap:.3rem;flex-wrap:wrap;margin-top:.3rem;">';
    Object.keys(f.revenueGrowth).forEach(function(y) {
      var v = f.revenueGrowth[y];
      if (v == null) return;
      var c = v >= 0 ? 'var(--green)' : 'var(--red)';
      html += '<span style="background:rgba(255,255,255,.04);padding:.2rem .45rem;border-radius:.25rem;font-size:.75rem;"><span style="color:var(--muted);">' + y + '</span> <span style="color:' + c + ';font-weight:600;">' + (v >= 0 ? '+' : '') + v.toFixed(1) + '%</span></span>';
    });
    html += '</div></div>';
  }

  html += '<div style="margin-top:.75rem;"><h3>Key Ratios</h3><div style="display:flex;flex-wrap:wrap;gap:.3rem;margin-top:.3rem;">';
  if (ratios.peRatio) html += '<span class="tag cyan">P/E: ' + ratios.peRatio + '</span>';
  if (ratios.forwardPE) html += '<span class="tag cyan">Fwd P/E: ' + ratios.forwardPE + '</span>';
  if (ratios.pbRatio) html += '<span class="tag cyan">P/B: ' + ratios.pbRatio + '</span>';
  if (ratios.roe) html += '<span class="tag green">ROE: ' + ratios.roe + '%</span>';
  if (ratios.roa) html += '<span class="tag green">ROA: ' + ratios.roa + '%</span>';
  if (ratios.debtToEquity) html += '<span class="tag gold">D/E: ' + ratios.debtToEquity + '</span>';
  if (ratios.currentRatio) html += '<span class="tag cyan">Current: ' + ratios.currentRatio + '</span>';
  if (ratios.dividendYield) html += '<span class="tag gold">Div: ' + ratios.dividendYield + '%</span>';
  if (ratios.beta) html += '<span class="tag">Beta: ' + ratios.beta + '</span>';
  html += '</div></div></div>';
  return html;
}

function fetchStockData(ticker) {
  var el = document.getElementById('stockData');
  if (!el) return;
  // Try NSE symbol
  var nseSymbol = ticker.includes('.') ? ticker : ticker + '.NS';
  fetch('/api/stock/info?symbol=' + encodeURIComponent(nseSymbol))
    .then(function(r){ return r.json(); })
    .then(function(data){
      var q = data.quote;
      if (!q || !q.regularMarketPrice) {
        el.innerHTML = '<span style="color:var(--muted);">No live market data available.</span>';
        return;
      }
      var chg = q.regularMarketChangePercent;
      var chgCls = chg >= 0 ? 'green' : 'red';
      var arrow = chg >= 0 ? '▲' : '▼';
      el.innerHTML = '<div style="display:flex;gap:1rem;flex-wrap:wrap;align-items:center;">' +
        '<div><span style="font-family:var(--fh);font-size:1.4rem;font-weight:700;">₹' + (q.regularMarketPrice || 0).toFixed(2) + '</span>' +
        ' <span class="badge ' + chgCls + '">' + arrow + ' ' + (chg || 0).toFixed(2) + '%</span></div>' +
        (q.regularMarketVolume ? '<div><span style="color:var(--muted);font-family:var(--fm);font-size:.7rem;">VOLUME</span><br><span style="font-size:.85rem;">' + q.regularMarketVolume.toLocaleString('en-IN') + '</span></div>' : '') +
        (q.regularMarketDayLow ? '<div><span style="color:var(--muted);font-family:var(--fm);font-size:.7rem;">DAY RANGE</span><br><span style="font-size:.85rem;">' + q.regularMarketDayLow.toFixed(2) + ' - ' + q.regularMarketDayHigh.toFixed(2) + '</span></div>' : '') +
        '</div>' +
        (data.indicators && data.indicators.rsi ? '<div style="margin-top:.4rem;display:flex;gap:.5rem;flex-wrap:wrap;">' +
          '<span class="tag ' + (data.indicators.rsi > 70 ? 'red' : data.indicators.rsi < 30 ? 'green' : 'cyan') + '">RSI: ' + data.indicators.rsi.toFixed(1) + '</span>' +
          (data.indicators.macd ? '<span class="tag ' + (data.indicators.macd > data.indicators.macdSignal ? 'green' : 'red') + '">MACD: ' + data.indicators.macd.toFixed(2) + '</span>' : '') +
          (data.indicators.sma50 ? '<span class="tag gold">SMA50: ' + data.indicators.sma50.toFixed(2) + '</span>' : '') +
          '</div>' : '');
    })
    .catch(function(){
      var el2 = document.getElementById('stockData');
      if (el2) el2.innerHTML = '<span style="color:var(--muted);">Market data unavailable.</span>';
    });
}

function addKnowledge() {
  var text = document.getElementById('kbInput').value.trim();
  var tag = document.getElementById('kbTag').value.trim() || 'general';
  if (!text) return;
  KNOWLEDGE_BASE.push({ text: text, tag: tag, date: new Date().toISOString() });
  document.getElementById('kbInput').value = '';
  document.getElementById('kbTag').value = '';
  renderKnowledge();
}

function renderKnowledge() {
  var el = document.getElementById('kbList');
  if (!el) return;
  if (!KNOWLEDGE_BASE.length) {
    el.innerHTML = '<div style="color:var(--muted);font-size:.82rem;">No knowledge entries yet.</div>';
    return;
  }
  var html = '';
  KNOWLEDGE_BASE.forEach(function(k, i){
    html += '<div class="kb-item"><span class="kb-tag">' + esc(k.tag) + '</span>' + esc(k.text) +
      ' <span style="float:right;font-size:.65rem;color:var(--muted);cursor:pointer;" onclick="KNOWLEDGE_BASE.splice(' + i + ',1);renderKnowledge();">✕</span></div>';
  });
  el.innerHTML = html;
}

function askCompany() {
  var input = document.getElementById('chatInput');
  var q = input.value.trim();
  if (!q) return;
  input.value = '';
  var msgs = document.getElementById('chatMsgs');
  msgs.innerHTML += '<div class="cm user">' + esc(q) + '</div>';
  msgs.innerHTML += '<div class="cm ai" style="color:var(--muted);">Thinking...</div>';
  msgs.scrollTop = msgs.scrollHeight;

  fetch('/api/company/ask', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      company: SYMBOL,
      question: q,
      knowledge: KNOWLEDGE_BASE
    })
  })
    .then(function(r){return r.json()})
    .then(function(data){
      msgs.innerHTML = msgs.innerHTML.replace(/<div class="cm ai" style="color:var\(--muted\);">Thinking\.\.\.<\/div>$/, '');
      msgs.innerHTML += '<div class="cm ai">' + (data.reply || 'No response') + '</div>';
      msgs.scrollTop = msgs.scrollHeight;
    })
    .catch(function(err){
      msgs.innerHTML = msgs.innerHTML.replace(/<div class="cm ai" style="color:var\(--muted\);">Thinking\.\.\.<\/div>$/, '');
      msgs.innerHTML += '<div class="cm ai" style="color:var(--red);">Error: ' + esc(err.message) + '</div>';
    });
}
